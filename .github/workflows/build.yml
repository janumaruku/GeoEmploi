name: Build GéoEmploi

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geoemploi
          POSTGRES_PASSWORD: geoemploi
          POSTGRES_DB: geoemploi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoemploi -d geoemploi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://geoemploi:geoemploi@localhost:5432/geoemploi_db

    steps:
      # ── Checkout ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python backend ───────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Seed database (demo accounts only)
        run: python -m scripts.seed_demo
        working-directory: backend

      - name: Backend smoke test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          HEALTH=$(curl -sf http://127.0.0.1:8000/health)
          echo "$HEALTH"
          echo "$HEALTH" | python -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status']=='ok' else 1)"
          kill %1
        working-directory: backend

      # ── Node.js frontend ─────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-node-modules: true
          cache-dependency-path: geoemploi-front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: geoemploi-front

      - name: Build frontend
        run: npm run build
        working-directory: geoemploi-front

      # ── Assemble & Upload ────────────────────────────────────────
      - name: Assemble build artifact
        run: |
          mkdir -p build/backend build/frontend
          # Backend sources (exclude caches, venvs, __pycache__)
          rsync -a --exclude='__pycache__' --exclude='*.pyc' \
                   --exclude='lib/' --exclude='.venv*' \
                   backend/ build/backend/
          # Frontend production bundle
          cp -r geoemploi-front/dist/* build/frontend/
          # Documentation
          cp DEMO_ACCOUNTS.md build/
          cp README.md build/ 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoemploi-build
          path: build/
          retention-days: 30
